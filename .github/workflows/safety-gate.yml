name: Safety gate

on:
  pull_request:
  push:
    branches:
      - main

permissions:
  contents: read

jobs:
  verify:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Install locked dependencies
        run: npm ci

      - name: Run tests
        run: npm test

      - name: Build
        run: npm run build

      - name: Architecture check (warn-only — TD-005 pre-existing, tracked in tech-debt-tracker.md)
        run: npm run check:architecture || echo "::warning::TD-005 useExchangeConfig.js bypasses binanceGateway — pre-existing, does not block deploy (see deploy.sh)"
